name: Desktop Receiver distributables

# Builds the Stream-to-PC receiver (:desktopApp) for every desktop platform from
# the one Compose/JVM codebase. jpackage cannot cross-build, and Compose bundles
# the build OS's Skia natives, so each platform's native installer
# (.msi / .dmg / .deb) and its portable app-image (bundled JRE, unzip-and-run,
# no install, no Java needed) are produced on a matching runner.
#
# Run it from the Actions tab to just build artifacts (login-only, expiring), or
# push a tag to publish a public GitHub Release that end users can download:
#   git tag desktop-v1.0.0 && git push origin desktop-v1.0.0
# The in-app "Get the PC app" nudge links to that release page.
#
# NOTE: artifacts are UNSIGNED. macOS users right-click → Open the first time
# (Gatekeeper); Windows shows a SmartScreen warning. Signing/notarization is a
# later step that needs certs (see docs/plans/03-stream-to-pc.md).

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

jobs:
  # Create the GitHub Release once (only on a desktop-v* tag); the matrix legs
  # then upload their assets to it. Nothing `needs:` the whole matrix, because
  # the Intel-mac leg may never get a runner.
  create-release:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create release (idempotent)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
          gh release create "$GITHUB_REF_NAME" \
            --title "OfflinePlaya Receiver ${GITHUB_REF_NAME#desktop-}" \
            --verify-tag \
            --notes "Portable app-images (unzip and run, no install, no Java needed) and native installers for Windows, macOS and Linux. Unsigned — see the README for first-launch steps (macOS: right-click → Open; Windows: More info → Run anyway)."

  package:
    needs: [create-release]
    if: always()
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
          - os: macos-14      # Apple Silicon runner → arm64
            name: macos-arm64
          - os: macos-13      # Intel runner → x64
            name: macos-x64
          - os: ubuntu-latest
            name: linux-x64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Temurin 17 ships jpackage, which Compose's nativeDistributions needs.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The portable app-image needs no external tooling, so it's the guaranteed
      # artifact. Non-minified on purpose: the receiver relies on
      # kotlinx-serialization and jmdns and has no desktop R8/proguard keep
      # rules, so a minified build could strip reflective bits and break.
      - name: Build portable app-image
        shell: bash
        run: |
          chmod +x ./gradlew || true
          ./gradlew :desktopApp:createDistributable --no-daemon

      # Native installer (.msi/.dmg/.deb). Best-effort: jpackage needs host
      # tooling (WiX for .msi on Windows), which a runner may lack — don't fail
      # the whole job over it; the portable app-image above still ships.
      - name: Build native installer (best-effort)
        continue-on-error: true
        shell: bash
        run: ./gradlew :desktopApp:packageDistributionForCurrentOS --no-daemon

      # Archive the app-image preserving the launcher's executable bit (a plain
      # upload-artifact zip is login-only and expiring; these archives go on the
      # public Release). macOS uses ditto for the .app bundle; Linux tar; Windows
      # Compress-Archive (perms are irrelevant there).
      - name: Archive app-image (macOS)
        if: runner.os == 'macOS'
        run: |
          cd desktopApp/build/compose/binaries/main/app
          ditto -c -k --keepParent "OfflinePlayaReceiver.app" \
            "$GITHUB_WORKSPACE/offlineplaya-receiver-${{ matrix.name }}.zip"
      - name: Archive app-image (Linux)
        if: runner.os == 'Linux'
        run: tar -czf "offlineplaya-receiver-${{ matrix.name }}.tar.gz" \
          -C desktopApp/build/compose/binaries/main/app OfflinePlayaReceiver
      - name: Archive app-image (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path desktopApp/build/compose/binaries/main/app/OfflinePlayaReceiver -DestinationPath "offlineplaya-receiver-${{ matrix.name }}.zip"

      # Workflow artifact (handy for CI / logged-in users), kept alongside.
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: offlineplaya-receiver-${{ matrix.name }}
          path: |
            offlineplaya-receiver-${{ matrix.name }}.*
            desktopApp/build/compose/binaries/main/dmg/**
            desktopApp/build/compose/binaries/main/msi/**
            desktopApp/build/compose/binaries/main/deb/**
          if-no-files-found: warn

      # Publish to the public GitHub Release (tag builds only). Each leg uploads
      # its own distinctly-named files, so the legs never collide; --clobber
      # makes re-runs idempotent.
      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=( offlineplaya-receiver-${{ matrix.name }}.* \
                  desktopApp/build/compose/binaries/main/dmg/* \
                  desktopApp/build/compose/binaries/main/msi/* \
                  desktopApp/build/compose/binaries/main/deb/* )
          echo "Uploading: ${files[*]}"
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
